name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Toolchain Rust per Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Test del core Rust
        working-directory: core
        run: cargo test

      - name: Compila APK
        working-directory: android
        run: |
          # Il runner espone l'NDK in ANDROID_NDK_ROOT; cargo-ndk legge ANDROID_NDK_HOME.
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK: $ANDROID_NDK_HOME"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rinomina APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="dev-${GITHUB_SHA::7}"
          cp android/app/build/outputs/apk/release/app-release.apk "xiso2xex-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: xiso2xex-apk
          path: xiso2xex-*.apk

      - name: Pubblica release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" xiso2xex-*.apk \
            --title "ISO → XEX $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
