name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Toolchain Rust per Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Test del core Rust
        working-directory: core
        run: cargo test

      - name: Compila APK
        working-directory: android
        run: |
          # Il runner espone l'NDK in ANDROID_NDK_ROOT; cargo-ndk legge ANDROID_NDK_HOME.
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK: $ANDROID_NDK_HOME"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Versione
        id: ver
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "xiso2xex-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: xiso2xex-apk
          path: xiso2xex-*.apk

      # Pubblica una release quando viene fatto push di un tag v*, oppure al
      # primo push in cui versionName (android/app/build.gradle.kts) non ha
      # ancora una release: per pubblicare una nuova versione basta
      # incrementare versionName/versionCode.
      - name: Pubblica release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.ver.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG esiste già: niente da pubblicare."
            exit 0
          fi
          gh release create "$TAG" xiso2xex-*.apk \
            --target "$GITHUB_SHA" \
            --title "ISO → XEX $TAG" \
            --notes-file .github/release-notes.md
